name: VStudy monitor deployment

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - "vstudy-monitor-state.enc"
      - ".github/vstudy-monitor-heartbeat.txt"

concurrency:
  group: vstudy-monitor-deployment
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install SSH key
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.VPS_SSH_PRIVATE_KEY }}

      - name: Trust deployment host
        env:
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: printf '%s\n' "$VPS_KNOWN_HOSTS" >> ~/.ssh/known_hosts

      - name: Upload application
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          rsync -az --delete \
            --exclude '.env' \
            --exclude 'data/' \
            --exclude '.git/' \
            ./ "$VPS_USER@$VPS_HOST:/opt/vstudy-app/"

      - name: Restart cloud service
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          ssh "$VPS_USER@$VPS_HOST" \
            'cd /opt/vstudy-app && docker compose up -d --build --remove-orphans && docker compose ps'