name: VStudy self-hosted test

on:
  workflow_dispatch:

jobs:
  vstudy-test:
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Check runner identity
        shell: pwsh
        run: |
          Write-Host "Runner user:"
          whoami
          Write-Host "LOCALAPPDATA: $env:LOCALAPPDATA"

      - name: Set up Python
        shell: pwsh
        run: |
          $python = "C:\Users\manoj\AppData\Local\Python\bin\python.exe"
          if (-not (Test-Path $python)) {
            throw "Python executable not found at $python"
          }
          & $python --version
          & $python -m pip install -r requirements.txt

      - name: Run VStudy persistent-profile test
        shell: pwsh
        run: |
          $env:VSTUDY_PROFILE_DIR = "C:/vstudy_chrome_profile"
          $env:CHROME_RUNTIME_DIR = "C:/vstudy_chrome_runtime"
          $env:HEADLESS = "true"
          $env:UNATTENDED = "true"
          $env:LOG_COURSE_RESULTS = "false"

          Write-Host "VSTUDY_PROFILE_DIR=$env:VSTUDY_PROFILE_DIR"
          Write-Host "CHROME_RUNTIME_DIR=$env:CHROME_RUNTIME_DIR"

          $python = "C:\Users\manoj\AppData\Local\Python\bin\python.exe"
          & $python test_vstudy_login.py 2>$null
